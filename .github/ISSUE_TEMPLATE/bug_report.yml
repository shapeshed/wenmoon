name: Bug report
description: Report a problem with wenmoon
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove API keys and personal
        portfolio data from any logs or configuration you paste.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `wenmoon -c ...`
        2. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `wenmoon --version`.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Data provider
      options:
        - CoinGecko
        - CoinMarketCap
        - Both
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any error output, with secrets removed.
      render: shell
