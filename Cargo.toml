[package]
authors = ["George Ornbo <george@shapeshed.com>"]
categories = ["command-line-utilities", "filesystem"]
description = "Your crypto portfolio and terminal together at last"
edition = "2021"
homepage = "https://github.com/shapeshed/wenmoon"
keywords = ["cli", "filesystem", "shell", "tool", "utility"]
license = "Apache-2.0"
name = "wenmoon"
readme = "README.md"
repository = "https://github.com/shapeshed/wenmoon"
rust-version = "1.88.0"
version = "0.5.0"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5.49", features = ["derive"] }
colored = "3.0.0"
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.13", features = ["json"] }
separator = "0.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = { version = "0.22.0", features = ["ansi"] }
tokio = { version = "1", features = ["full"] }
toml = "1.0.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package.metadata.deb]
maintainer = "George Ornbo <george@shapeshed.com>"
copyright = "2024, George Ornbo"
section = "utils"
priority = "optional"
extended-description = "Your crypto portfolio and terminal together at last."

[profile.release]
codegen-units = 1
debug = 0
lto = true
strip = true
